services:
  - type: web
    name: kkutu-game
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd Server/lib && npm install && npx grunt default pack && cd ../.. && node setup-render-db.js
    startCommand: node render-entry.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kkutu-db
          property: connectionString

databases:
  - name: kkutu-db
    plan: free
    region: singapore
